    steps:
    - name: Checkout master branch
      uses: actions/checkout@v4
      with:
        # Use master branch (current codebase with KF6 dependencies)
        submodules: recursive

    - name: Verify master branch checkout
      run: |
        echo "Current commit: $(git rev-parse HEAD)"
        echo "Current branch: $(git branch --show-current 2>/dev/null || echo 'detached HEAD')"
        
        # Show recent commits
        git log --oneline -n 3
        
        echo "=== Verifying this is Qt6/KF6 code ==="
        
        # Check CMakeLists.txt for KF6 dependencies (should exist in master)
        if grep -q "find_package.*KF6" CMakeLists.txt 2>/dev/null; then
          echo "✅ Found KF6 dependencies in CMakeLists.txt - confirmed master branch"
          echo "KF6 packages required:"
          grep "find_package.*KF6" CMakeLists.txt
        else
          echo "⚠️  No KF6 dependencies found - may not be on the right branch"
        fi
        
        # Check for modern features (KJob, etc.)
        if find src -name "*job*" -type f | head -5; then
          echo "✅ Found job-related files (modern KF6 features)"
        else
          echo "⚠️  No job files found"
        fi

    - name: Install base dependencies
      run: |
        echo "=== Installing base build tools ==="
        
        # Update Homebrew
        brew update

        # Install base build tools
        echo "cmake: $(command -v cmake && cmake --version | head -1 || echo 'not found')"
        if ! command -v cmake >/dev/null 2>&1; then
          brew install cmake
        fi

        echo "ninja: $(command -v ninja && ninja --version || echo 'not found')"  
        if ! command -v ninja >/dev/null 2>&1; then
          brew install ninja
        fi

        # Install Qt6
        echo "Installing Qt6..."
        if ! brew list qt@6 >/dev/null 2>&1; then
          brew install qt@6
        else
          echo "Qt6 already installed"
        fi

        # Install dependencies for building KF6
        echo "Installing KF6 build dependencies..."
        brew install extra-cmake-modules || echo "extra-cmake-modules install failed"
        
        # Install additional tools we'll need
        brew install git wget python3 || echo "Some tools install failed"
        
        # Install imagemagick for icon conversion
        if ! command -v magick >/dev/null 2>&1; then
          brew install imagemagick
        fi

    - name: Set Qt6 environment
      run: |
        # Set up Qt6 paths
        echo "$(brew --prefix qt@6)/bin" >> $GITHUB_PATH
        echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@6)" >> $GITHUB_ENV
        echo "Qt6_DIR=$(brew --prefix qt@6)/lib/cmake/Qt6" >> $GITHUB_ENV

        # Display Qt6 version info
        echo "Qt6 installation path: $(brew --prefix qt@6)"
        echo "Qt6 version: $($(brew --prefix qt@6)/bin/qmake -version)"
        
        # Set up build environment
        echo "CMAKE_BUILD_PARALLEL_LEVEL=$(sysctl -n hw.ncpu)" >> $GITHUB_ENV
        echo "MAKEFLAGS=-j$(sysctl -n hw.ncpu)" >> $GITHUB_ENV

    - name: Build KF6 from source
      run: |
        echo "=== Building KF6 from source ==="
        echo "Starting KF6 build process at $(date)"
        
        # Verify we have the necessary tools
        echo "Checking build tools:"
        echo "cmake: $(cmake --version | head -1)"
        echo "make: $(make --version | head -1)"
        echo "git: $(git --version)"
        
        # Create workspace
        mkdir -p ~/kf6-build
        cd ~/kf6-build
        
        echo "Working directory: $(pwd)"
        echo "Available space: $(df -h . | tail -1)"
        
        # KF6 components needed by Katalog (in dependency order)
        KF6_COMPONENTS=(
          "extra-cmake-modules"  # Build system (first)
          "kcoreaddons"         # Core utilities
          "ki18n"              # Internationalization  
          "kconfig"            # Configuration system
          "kwidgetsaddons"     # Widget utilities (needed by kxmlgui)
          "kconfigwidgets"     # Config widgets (needed by kxmlgui)
          "kglobalaccel"       # Global shortcuts (needed by kxmlgui) 
          "kxmlgui"            # XML GUI framework
          "kiconthemes"        # Icon theme support
        )
        
        # Set up common cmake args
        CMAKE_ARGS=(
          "-DCMAKE_PREFIX_PATH=$(brew --prefix qt@6)"
          "-DCMAKE_BUILD_TYPE=Release"
          "-DCMAKE_INSTALL_PREFIX=$(brew --prefix)"
          "-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0"
          "-DBUILD_TESTING=OFF"
          "-DBUILD_QCH=OFF"
          "-DQT_MAJOR_VERSION=6"
        )
        
        echo "Building KF6 components: ${KF6_COMPONENTS[*]}"
        echo "CMake args: ${CMAKE_ARGS[*]}"
        
        # Track successful builds
        SUCCESSFUL_BUILDS=()
        FAILED_BUILDS=()
        
        for component in "${KF6_COMPONENTS[@]}"; do
          echo ""
          echo "========================================="
          echo "=== Building $component ($(date)) ==="
          echo "========================================="
          
          # Clone the component
          if [ "$component" = "extra-cmake-modules" ]; then
            REPO_URL="https://invent.kde.org/frameworks/extra-cmake-modules.git"
          else
            REPO_URL="https://invent.kde.org/frameworks/$component.git"
          fi
          
          echo "Cloning from: $REPO_URL"
          if git clone --depth 1 --branch "${{ github.event.inputs.kf6_version || 'v6.7.0' }}" "$REPO_URL" "$component" 2>&1 || \
             git clone --depth 1 "$REPO_URL" "$component" 2>&1; then
            echo "✅ Successfully cloned $component"
          else
            echo "❌ Failed to clone $component"
            FAILED_BUILDS+=("$component (clone failed)")
            continue
          fi
          
          cd "$component"
          echo "Component directory contents:"
          ls -la | head -10
          
          mkdir -p build && cd build
          
          # Configure
          echo "--- Configuring $component ---"
          if cmake .. "${CMAKE_ARGS[@]}" 2>&1 | tee cmake_config.log; then
            echo "✅ Configuration successful for $component"
          else
            echo "❌ Configuration failed for $component"
            echo "=== Configuration error details ==="
            tail -50 cmake_config.log || echo "No config log available"
            FAILED_BUILDS+=("$component (config failed)")
            cd ~/kf6-build
            continue
          fi
          
          # Build
          echo "--- Building $component ---"
          if make -j$(sysctl -n hw.ncpu) 2>&1 | tee build.log; then
            echo "✅ Build successful for $component"
          else
            echo "❌ Build failed for $component"
            echo "=== Build error details ==="
            tail -50 build.log || echo "No build log available"
            FAILED_BUILDS+=("$component (build failed)")
            cd ~/kf6-build
            continue
          fi
          
          # Install
          echo "--- Installing $component ---"
          if make install 2>&1 | tee install.log; then
            echo "✅ Installation successful for $component"
            SUCCESSFUL_BUILDS+=("$component")
            
            # Verify installation for critical components
            if [ "$component" = "kxmlgui" ]; then
              echo "=== Verifying KF6XmlGui installation ==="
              find "$(brew --prefix)" -name "*KF6XmlGui*" -o -name "*kxmlgui*" | head -10
              if find "$(brew --prefix)" -name "KF6XmlGuiConfig.cmake" 2>/dev/null; then
                echo "✅ KF6XmlGui cmake config found"
              else
                echo "❌ KF6XmlGui cmake config NOT found after installation"
              fi
            fi
            
          else
            echo "❌ Installation failed for $component"
            echo "=== Installation error details ==="
            tail -50 install.log || echo "No install log available"
            FAILED_BUILDS+=("$component (install failed)")
            cd ~/kf6-build
            continue
          fi
          
          cd ~/kf6-build
          echo "✅ Completed $component successfully"
        done
        
        echo ""
        echo "========================================="
        echo "=== KF6 Build Summary ==="
        echo "========================================="
        echo "Successful builds (${#SUCCESSFUL_BUILDS[@]}): ${SUCCESSFUL_BUILDS[*]}"
        echo "Failed builds (${#FAILED_BUILDS[@]}): ${FAILED_BUILDS[*]}"
        
        # Check if we have the minimum required components
        REQUIRED_COMPONENTS=("extra-cmake-modules" "kcoreaddons" "ki18n" "kconfig" "kxmlgui")
        MISSING_REQUIRED=()
        
        for required in "${REQUIRED_COMPONENTS[@]}"; do
          if [[ ! " ${SUCCESSFUL_BUILDS[*]} " =~ " $required " ]]; then
            MISSING_REQUIRED+=("$required")
          fi
        done
        
        if [ ${#MISSING_REQUIRED[@]} -gt 0 ]; then
          echo ""
          echo "❌ CRITICAL: Missing required components: ${MISSING_REQUIRED[*]}"
          echo "Will try to continue with partial KF6 installation..."
          echo "Katalog may build with reduced functionality"
        else
          echo "✅ All required KF6 components built successfully"
        fi
        
        echo "=== KF6 build summary ==="
        echo "Checking installed KF6 packages..."
        
        echo "KF6 cmake files found:"
        find "$(brew --prefix)" -name "*KF6*Config.cmake" 2>/dev/null | sort || echo "No KF6 cmake configs found"
        
        echo ""
        echo "KF6 directories in cmake:"
        ls -la "$(brew --prefix)/lib/cmake" | grep -i kf6 || echo "No KF6 directories in cmake"
        
        echo ""
        echo "Specifically checking for KF6XmlGui:"
        find "$(brew --prefix)" -name "*XmlGui*" -o -name "*xmlgui*" 2>/dev/null | head -10 || echo "No XmlGui files found"
        
        # Update CMAKE_PREFIX_PATH with explicit KF6 paths
        KF6_CMAKE_DIRS=""
        for kf6_dir in "$(brew --prefix)"/lib/cmake/KF6*; do
          if [ -d "$kf6_dir" ]; then
            KF6_CMAKE_DIRS="$KF6_CMAKE_DIRS:$(dirname "$kf6_dir")"
          fi
        done
        
        if [ -n "$KF6_CMAKE_DIRS" ]; then
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@6)$KF6_CMAKE_DIRS:$(brew --prefix)" >> $GITHUB_ENV
          echo "Updated CMAKE_PREFIX_PATH with KF6 directories: $KF6_CMAKE_DIRS"
        else
          echo "No KF6 cmake directories found to add to CMAKE_PREFIX_PATH"
        fi

    - name: Debug KF6 installation status
      run: |
        echo "=== Detailed KF6 Installation Debug ==="
        
        # Check what actually got installed
        echo "All KF6 related files in brew prefix:"
        find "$(brew --prefix)" -name "*KF6*" -o -name "*kf6*" | head -20
        
        echo ""
        echo "Contents of cmake directory:"
        ls -la "$(brew --prefix)/lib/cmake/" | head -20
        
        echo ""
        echo "Checking specific KF6 cmake modules:"
        for component in CoreAddons I18n XmlGui Config IconThemes; do
          config_file="$(brew --prefix)/lib/cmake/KF6${component}/KF6${component}Config.cmake"
          if [ -f "$config_file" ]; then
            echo "✅ Found KF6${component}Config.cmake"
          else
            echo "❌ Missing KF6${component}Config.cmake"
            # Look for alternative locations
            find "$(brew --prefix)" -name "KF6${component}Config.cmake" 2>/dev/null || echo "  Not found anywhere"
          fi
        done
        
        echo ""
        echo "Current CMAKE_PREFIX_PATH: $CMAKE_PREFIX_PATH"

    - name: Make KF6XmlGui optional (fallback approach)
      run: |
        echo "=== Creating fallback CMakeLists.txt ==="
        
        # Check if KF6XmlGui is actually available
        if ! find "$(brew --prefix)" -name "KF6XmlGuiConfig.cmake" >/dev/null 2>&1; then
          echo "KF6XmlGui not found - creating version without it"
          
          # Create a backup of original CMakeLists.txt
          cp CMakeLists.txt CMakeLists.txt.original
          
          # Modify CMakeLists.txt to make KF6XmlGui optional
          sed 's/find_package(KF6XmlGui REQUIRED)/find_package(KF6XmlGui QUIET)/' CMakeLists.txt > CMakeLists.txt.modified
          
          # Also comment out KF6::XmlGui linking if KF6XmlGui is not found
          if ! find "$(brew --prefix)" -name "KF6XmlGuiConfig.cmake" >/dev/null 2>&1; then
            echo "Modifying target_link_libraries to exclude KF6::XmlGui"
            sed 's/KF6::XmlGui/#KF6::XmlGui # Not available on macOS/' CMakeLists.txt.modified > CMakeLists.txt.temp
            mv CMakeLists.txt.temp CMakeLists.txt.modified
          fi
          
          mv CMakeLists.txt.modified CMakeLists.txt
          
          echo "Modified CMakeLists.txt to work without KF6XmlGui:"
          echo "Changes made:"
          diff CMakeLists.txt.original CMakeLists.txt || echo "Diff complete"
        else
          echo "KF6XmlGui found - using original CMakeLists.txt"
        fi

    - name: Set version information
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version_tag }}" ]; then
          echo "VERSION_TAG=${{ github.event.inputs.version_tag }}" >> $GITHUB_ENV
        else
          echo "VERSION_TAG=master-qt6-kf6-$(date +%Y%m%d-%H%M)" >> $GITHUB_ENV
        fi

        echo "Building version: $VERSION_TAG"

    - name: Build Katalog with Qt6/KF6
      run: |
        mkdir build
        cd build

        # Set up environment for KF6 - EXPLICIT paths
        QT6_PATH="$(brew --prefix qt@6)"
        BREW_PREFIX="$(brew --prefix)"
        
        # Build explicit CMAKE_PREFIX_PATH correctly (no duplicates)
        CMAKE_PREFIX_PATH_FULL="${QT6_PATH}:${BREW_PREFIX}/lib/cmake:${BREW_PREFIX}"
        
        echo ""
        echo "=== CMake Environment Setup ==="
        echo "QT6_PATH: $QT6_PATH"
        echo "BREW_PREFIX: $BREW_PREFIX"
        echo "CMAKE_PREFIX_PATH_FULL: $CMAKE_PREFIX_PATH_FULL"
        
        # Export environment variables for this step
        export CMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH_FULL"
        export PKG_CONFIG_PATH="${BREW_PREFIX}/lib/pkgconfig:$PKG_CONFIG_PATH"
        
        # Set explicit KF6 directories for cmake
        export KF6CoreAddons_DIR="${BREW_PREFIX}/lib/cmake/KF6CoreAddons"
        export KF6I18n_DIR="${BREW_PREFIX}/lib/cmake/KF6I18n"
        export KF6XmlGui_DIR="${BREW_PREFIX}/lib/cmake/KF6XmlGui"
        export KF6Config_DIR="${BREW_PREFIX}/lib/cmake/KF6Config"
        export KF6IconThemes_DIR="${BREW_PREFIX}/lib/cmake/KF6IconThemes"
        
        echo ""
        echo "=== Explicit KF6 Directory Variables ==="
        echo "KF6CoreAddons_DIR: $KF6CoreAddons_DIR"
        echo "KF6I18n_DIR: $KF6I18n_DIR"
        echo "KF6XmlGui_DIR: $KF6XmlGui_DIR"
        echo "KF6Config_DIR: $KF6Config_DIR"
        echo "KF6IconThemes_DIR: $KF6IconThemes_DIR"
        
        # Verify these directories actually exist
        echo ""
        echo "=== Verifying KF6 directories exist ==="
        for var in KF6CoreAddons_DIR KF6I18n_DIR KF6XmlGui_DIR KF6Config_DIR KF6IconThemes_DIR; do
          eval "dir=\$var"
          if [ -d "$dir" ]; then
            echo "✅ $var: $dir (exists)"
            ls -la "$dir"/*.cmake | head -3 || echo "No cmake files in $dir"
          else
            echo "❌ $var: $dir (does not exist)"
          fi
        done
        
        # Verify KF6 packages are findable with explicit paths
        echo ""
        echo "=== Testing CMake find_package with explicit paths ==="
        for pkg in KF6CoreAddons KF6I18n KF6XmlGui KF6Config KF6IconThemes; do
          eval "pkg_dir=\${pkg}_DIR"
          if [ -f "${pkg_dir}/${pkg}Config.cmake" ]; then
            echo "✅ $pkg: ${pkg_dir}/${pkg}Config.cmake exists"
          else
            echo "❌ $pkg: ${pkg_dir}/${pkg}Config.cmake missing"
          fi
        done
        
        # Configure with CMake using explicit paths
        echo ""
        echo "=== Running CMake Configuration ==="
        echo "Final CMAKE_PREFIX_PATH: $CMAKE_PREFIX_PATH"
        
        if cmake .. \
          -GNinja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
          -DBUILD_TESTS=OFF \
          -DCMAKE_INSTALL_PREFIX=/Applications \
          -DKF6CoreAddons_DIR="$KF6CoreAddons_DIR" \
          -DKF6I18n_DIR="$KF6I18n_DIR" \
          -DKF6XmlGui_DIR="$KF6XmlGui_DIR" \
          -DKF6Config_DIR="$KF6Config_DIR" \
          -DKF6IconThemes_DIR="$KF6IconThemes_DIR" \
          -DCMAKE_VERBOSE_MAKEFILE=ON; then
          echo "✅ CMake configuration successful"
        else
          echo "❌ CMake configuration failed"
          echo ""
          echo "=== Detailed CMake Error Analysis ==="
          
          # Show CMake cache for KF6 entries
          echo "CMake cache entries for KF6:"
          grep -i kf6 CMakeCache.txt || echo "No KF6 entries in CMakeCache.txt"
          
          # Show CMake error log if available
          if [ -f "CMakeFiles/CMakeError.log" ]; then
            echo "CMake error log:"
            cat CMakeFiles/CMakeError.log
          fi
          
          # Show CMake output log if available  
          if [ -f "CMakeFiles/CMakeOutput.log" ]; then
            echo "CMake output log (last 50 lines):"
            tail -50 CMakeFiles/CMakeOutput.log
          fi
          
          exit 1
        fi

        # Build translations first (may fail but continue)
        echo ""
        echo "=== Building translations ==="
        ninja Katalog_lrelease || echo "Translation build failed, continuing..."

        # Build the main application
        echo ""
        echo "=== Building main application ==="
        if ninja; then
          echo "✅ Build successful!"
        else
          echo "❌ Build failed"
          exit 1
        fi

        # Check what was built
        echo ""
        echo "=== Build output ==="
        find . -name "*.app" -o -name "Katalog*" -type f | head -10
        
        if [ -d "Katalog.app" ]; then
          echo "✅ macOS app bundle created successfully"
          ls -la Katalog.app/Contents/ || echo "Could not list bundle contents"
        elif [ -f "Katalog" ]; then
          echo "✅ Katalog executable created"
        else
          echo "❌ No Katalog app or executable found"
          exit 1
        fi

    - name: Create app bundle and package
      run: |
        cd build
        
        # Ensure we have the app bundle
        if [ ! -d "Katalog.app" ]; then
          echo "Creating app bundle manually..."
          mkdir -p Katalog.app/Contents/{MacOS,Resources,Frameworks}
          
          # Create Info.plist
          cat > Katalog.app/Contents/Info.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>CFBundleExecutable</key>
          <string>Katalog</string>
          <key>CFBundleIdentifier</key>
          <string>io.github.stephanecouturier.katalog</string>
          <key>CFBundleName</key>
          <string>Katalog</string>
          <key>CFBundleDisplayName</key>
          <string>Katalog</string>
          <key>CFBundleVersion</key>
          <string>2.7-dev</string>
          <key>CFBundlePackageType</key>
          <string>APPL</string>
          <key>CFBundleSignature</key>
          <string>KTLG</string>
          <key>LSMinimumSystemVersion</key>
          <string>11.0</string>
          <key>NSHighResolutionCapable</key>
          <true/>
          <key>CFBundleIconFile</key>
          <string>Katalog.icns</string>
        </dict>
        </plist>
        EOF

          # Copy executable
          if [ -f "Katalog" ]; then
            cp Katalog Katalog.app/Contents/MacOS/
          fi
        fi

        # Use macdeployqt
        echo "Running macdeployqt..."
        MACDEPLOYQT="$(brew --prefix qt@6)/bin/macdeployqt"
        
        if [ -f "$MACDEPLOYQT" ]; then
          "$MACDEPLOYQT" Katalog.app -verbose=2 || echo "macdeployqt completed with warnings"
        fi

        # Create icon (non-fatal)
        if [ -f "../src/images/Katalog_logo_64.ico" ]; then
          echo "Creating app icon..."
          mkdir -p Katalog.iconset
          
          if command -v magick >/dev/null; then
            magick "../src/images/Katalog_logo_64.ico" -resize 512x512 "Katalog.iconset/icon_512x512.png" || echo "Icon conversion failed"
            magick "../src/images/Katalog_logo_64.ico" -resize 256x256 "Katalog.iconset/icon_256x256.png" || echo "Icon conversion failed"  
            magick "../src/images/Katalog_logo_64.ico" -resize 128x128 "Katalog.iconset/icon_128x128.png" || echo "Icon conversion failed"
            magick "../src/images/Katalog_logo_64.ico" -resize 64x64 "Katalog.iconset/icon_64x64.png" || echo "Icon conversion failed"
            magick "../src/images/Katalog_logo_64.ico" -resize 32x32 "Katalog.iconset/icon_32x32.png" || echo "Icon conversion failed"
            magick "../src/images/Katalog_logo_64.ico" -resize 16x16 "Katalog.iconset/icon_16x16.png" || echo "Icon conversion failed"
            
            iconutil -c icns Katalog.iconset -o Katalog.app/Contents/Resources/Katalog.icns || echo "ICNS creation failed"
          fi
        fi

        # Create DMG
        echo "Creating DMG..."
        brew install create-dmg || echo "create-dmg not available"
        
        DMG_NAME="Katalog-${{ env.VERSION_TAG }}-macOS.dmg"
        
        if command -v create-dmg >/dev/null; then
          create-dmg \
            --volname "Katalog" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "Katalog.app" 175 120 \
            --hide-extension "Katalog.app" \
            --app-drop-link 425 120 \
            "$DMG_NAME" \
            Katalog.app || echo "create-dmg failed, trying hdiutil"
        fi
        
        if [ ! -f "$DMG_NAME" ]; then
          echo "Using hdiutil fallback..."
          hdiutil create -srcfolder Katalog.app -format UDZO -o "$DMG_NAME"
        fi
        
        echo "DMG created: $DMG_NAME"
        ls -lh *.dmg

    - name: Test app bundle
      run: |
        cd build
        
        if [ -d "Katalog.app" ]; then
          echo "✅ App bundle exists"
          
          if [ -x "Katalog.app/Contents/MacOS/Katalog" ]; then
            echo "✅ Executable found and is executable"
            
            # Check dependencies
            echo "Dependencies:"
            otool -L Katalog.app/Contents/MacOS/Katalog | head -15
            
            # Check for KF6 libraries
            echo "Checking for KF6 libraries in bundle..."
            find Katalog.app -name "*KF6*" || echo "No KF6 libraries found in bundle"
            
          else
            echo "❌ Executable not found or not executable"
          fi
        else
          echo "❌ No app bundle found"
        fi

    - name: Upload DMG as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Katalog-Qt6-KF6-macOS-${{ env.VERSION_TAG }}
        path: build/Katalog-${{ env.VERSION_TAG }}-macOS.dmg
        retention-days: 30

    - name: Upload App Bundle as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Katalog-Qt6-KF6-AppBundle-${{ env.VERSION_TAG }}
        path: build/Katalog.app
        retention-days: 7

    - name: Summary
      run: |
        echo "## macOS Qt6/KF6 Build Complete! 🍎" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Version**: ${{ env.VERSION_TAG }}" >> $GITHUB_STEP_SUMMARY
        echo "- **File**: Katalog-${{ env.VERSION_TAG }}-macOS.dmg" >> $GITHUB_STEP_SUMMARY
        echo "- **Size**: $(ls -lh build/Katalog-*.dmg 2>/dev/null | awk '{print $5}' || echo 'N/A')" >> $GITHUB_STEP_SUMMARY
        echo "- **Target**: macOS 11.0+ (Big Sur and later)" >> $GITHUB_STEP_SUMMARY
        echo "- **Architecture**: $(uname -m)" >> $GITHUB_STEP_SUMMARY
        echo "- **Qt Version**: $($(brew --prefix qt@6)/bin/qmake -version | grep 'Qt version' || echo 'Unknown')" >> $GITHUB_STEP_SUMMARY
        echo "- **KF6 Version**: ${{ github.event.inputs.kf6_version || 'v6.7.0' }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Codebase**: master (Qt6 + KF6 with all modern features)" >> $GITHUB_STEP_SUMMARY
        echo "- **Status**: 📦 Available as build artifact" >> $GITHUB_STEP_SUMMARY
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Notes:" >> $GITHUB_STEP_SUMMARY
        echo "- Built from master branch with full Qt6/KF6 stack" >> $GITHUB_STEP_SUMMARY
        echo "- Includes KJob and all modern Katalog features" >> $GITHUB_STEP_SUMMARY
        echo "- KF6 components built from source" >> $GITHUB_STEP_SUMMARY
        echo "- Compatible with Apple Silicon and Intel Macs" >> $GITHUB_STEP_SUMMARY
        echo "- May require 'Allow apps from anywhere' on first run" >> $GITHUB_STEP_SUMMARY
