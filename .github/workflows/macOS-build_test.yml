name: Build macOS (Qt6/KF6) dev
# Improved build strategy focusing on essential KF6 components with proper fallbacks
on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag (e.g., v2.8-macos)'
        required: false
        default: 'dev-macos-qt6-kf6'
      kf6_version:
        description: 'KF6 version to build'
        required: false
        default: 'v6.7.0'
      use_source_build:
        description: 'Force build KF6 from source'
        required: false
        default: 'false'
        type: boolean

  push:
    branches: [ main, katalog_development ]
    paths: 
      - '.github/workflows/macOS-build_improved.yml'

jobs:
  build-macos-qt6-kf6:
    runs-on: macos-14  # macOS Sonoma (Apple Silicon)

    steps:
    - name: Checkout master branch
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Verify Qt6/KF6 codebase
      run: |
        echo "Current commit: $(git rev-parse HEAD)"
        echo "Current branch: $(git branch --show-current 2>/dev/null || echo 'detached HEAD')"
        
        # Verify this is Qt6/KF6 code
        if grep -q "find_package.*KF6" CMakeLists.txt 2>/dev/null; then
          echo "✅ Found KF6 dependencies in CMakeLists.txt"
          echo "KF6 packages required:"
          grep "find_package.*KF6" CMakeLists.txt
        else
          echo "⚠️  No KF6 dependencies found - may not be on the right branch"
        fi

    - name: Install base dependencies and Qt6
      run: |
        echo "=== Installing base build tools and Qt6 ==="
        
        # Update Homebrew
        brew update

        # Install essential build tools
        brew install cmake ninja

        # Install Qt6 - this should always work via Homebrew
        echo "Installing Qt6..."
        brew install qt@6
        
        # Verify Qt6 installation
        QT6_PREFIX=$(brew --prefix qt@6)
        echo "Qt6 installed at: $QT6_PREFIX"
        
        if [ ! -f "$QT6_PREFIX/lib/cmake/Qt6/Qt6Config.cmake" ]; then
          echo "❌ Qt6 installation incomplete"
          exit 1
        else
          echo "✅ Qt6 installation verified"
        fi

    - name: Try Homebrew KF6 packages (best case scenario)
      id: homebrew_kf6
      continue-on-error: true
      run: |
        echo "=== Attempting to install KF6 via Homebrew ==="

        # Try to update brew, add repo and 
        brew update
        brew tap kde/kde
        brew install extra-cmake-modules kf6-kcoreaddons kf6-ki18n kf6-kconfig kf6-kxmlgui kf6-kfilemetadata
        echo "= Update and install attempted ="
        # export CMAKE_PREFIX_PATH="$(brew --prefix)/lib/cmake:$(brew --prefix qt6):$CMAKE_PREFIX_PATH"
        
        # Try to install KF6 packages via Homebrew
        # Note: These may not be available, but worth trying
        KF6_PACKAGES=(
          "extra-cmake-modules"
          "kf6-kcoreaddons"
          "kf6-ki18n"
          "kf6-kconfig"
          "kf6-kxmlgui"
          "kf6-kiconthemes"
        )
        
        HOMEBREW_SUCCESS=0
        AVAILABLE_PACKAGES=()
        
        for pkg in "${KF6_PACKAGES[@]}"; do
          echo "Checking if $pkg is available..."
          if brew search "$pkg" | grep -q "^$pkg\$"; then
            echo "  ✅ $pkg found in Homebrew"
            if brew install "$pkg"; then
              AVAILABLE_PACKAGES+=("$pkg")
              echo "  ✅ $pkg installed successfully"
            else
              echo "  ❌ $pkg installation failed"
            fi
          else
            echo "  ⚠️  $pkg not available in Homebrew"
          fi
        done
        
        echo "HOMEBREW_KF6_PACKAGES=${AVAILABLE_PACKAGES[*]}" >> $GITHUB_ENV
        
        if [ ${#AVAILABLE_PACKAGES[@]} -gt 0 ]; then
          echo "✅ Some KF6 packages installed via Homebrew: ${AVAILABLE_PACKAGES[*]}"
          echo "HOMEBREW_KF6_SUCCESS=true" >> $GITHUB_ENV
        else
          echo "❌ No KF6 packages available via Homebrew"
          echo "HOMEBREW_KF6_SUCCESS=false" >> $GITHUB_ENV
        fi

    - name: Build essential KF6 components from source
      if: env.HOMEBREW_KF6_SUCCESS == 'false' || github.event.inputs.use_source_build == 'true'
      run: |
        echo "=== Building essential KF6 components from source ==="
        
        # Create build directory
        mkdir -p ~/kf6-build
        cd ~/kf6-build
        
        # Set up cmake arguments - simplified for essential components only
        CMAKE_ARGS=(
          "-DCMAKE_PREFIX_PATH=$(brew --prefix qt@6)"
          "-DCMAKE_BUILD_TYPE=Release"
          "-DCMAKE_INSTALL_PREFIX=$(brew --prefix)"
          "-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0"
          "-DBUILD_TESTING=OFF"
          "-DBUILD_QCH=OFF"
          "-DQT_MAJOR_VERSION=6"
        )
        
        # Essential KF6 components only - in correct dependency order
        # Focus on what Katalog actually needs to function
        ESSENTIAL_COMPONENTS=(
          "extra-cmake-modules"  # Build system (required first)
          "kcoreaddons"         # Core utilities (KJob, etc) - ESSENTIAL
          "kconfig"             # Configuration system - ESSENTIAL  
          "ki18n"               # Internationalization - NICE TO HAVE
        )
        
        echo "Building essential KF6 components: ${ESSENTIAL_COMPONENTS[*]}"
        
        SUCCESSFUL_BUILDS=()
        FAILED_BUILDS=()
        
        for component in "${ESSENTIAL_COMPONENTS[@]}"; do
          echo ""
          echo "========================================="
          echo "=== Building $component ==="
          echo "========================================="
          
          # Clone the component
          if [ "$component" = "extra-cmake-modules" ]; then
            REPO_URL="https://invent.kde.org/frameworks/extra-cmake-modules.git"
          else
            REPO_URL="https://invent.kde.org/frameworks/$component.git"
          fi
          
          echo "Cloning $REPO_URL"
          
          if git clone --depth=1 --branch "${{ github.event.inputs.kf6_version }}" "$REPO_URL" "$component" 2>/dev/null; then
            echo "✅ Cloned $component successfully"
          else
            echo "⚠️  Failed to clone specific version, trying master..."
            if git clone --depth=1 "$REPO_URL" "$component"; then
              echo "✅ Cloned $component from master"
            else
              echo "❌ Failed to clone $component"
              FAILED_BUILDS+=("$component (clone failed)")
              continue
            fi
          fi
          
          cd "$component"
          
          # Build and install
          echo "Building $component..."
          mkdir build && cd build
          
          if cmake .. "${CMAKE_ARGS[@]}"; then
            echo "✅ CMake configuration successful for $component"
          else
            echo "❌ CMake configuration failed for $component"
            FAILED_BUILDS+=("$component (cmake failed)")
            cd ~/kf6-build
            continue
          fi
          
          if make -j$(sysctl -n hw.ncpu); then
            echo "✅ Build successful for $component"
          else
            echo "❌ Build failed for $component"
            FAILED_BUILDS+=("$component (build failed)")
            cd ~/kf6-build
            continue
          fi
          
          if make install; then
            echo "✅ Installation successful for $component"
            SUCCESSFUL_BUILDS+=("$component")
          else
            echo "❌ Installation failed for $component"
            FAILED_BUILDS+=("$component (install failed)")
            cd ~/kf6-build
            continue
          fi
          
          cd ~/kf6-build
          echo "✅ Completed $component successfully"
        done
        
        echo ""
        echo "========================================="
        echo "=== Essential KF6 Build Summary ==="
        echo "========================================="
        echo "Successful builds: ${SUCCESSFUL_BUILDS[*]}"
        echo "Failed builds: ${FAILED_BUILDS[*]}"
        
        # Check minimum requirements
        if [[ " ${SUCCESSFUL_BUILDS[*]} " =~ " extra-cmake-modules " ]] && \
           [[ " ${SUCCESSFUL_BUILDS[*]} " =~ " kcoreaddons " ]] && \
           [[ " ${SUCCESSFUL_BUILDS[*]} " =~ " kconfig " ]]; then
          echo "✅ Minimum KF6 requirements met (ECM + CoreAddons + Config)"
          echo "ESSENTIAL_KF6_READY=true" >> $GITHUB_ENV
        else
          echo "❌ Minimum KF6 requirements not met"
          echo "ESSENTIAL_KF6_READY=false" >> $GITHUB_ENV
        fi

    - name: Configure build environment
      run: |
        echo "=== Configuring build environment ==="
        
        # Build CMAKE_PREFIX_PATH with all available components
        CMAKE_PREFIX_PATH="$(brew --prefix qt@6)"
        
        # Add Homebrew KF6 components if available  
        if [ "$HOMEBREW_KF6_SUCCESS" = "true" ]; then
          CMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH:$(brew --prefix)/lib/cmake"
        fi
        
        # Add built-from-source KF6 components
        if [ "$ESSENTIAL_KF6_READY" = "true" ]; then
          for kf6_dir in "$(brew --prefix)"/lib/cmake/KF6*; do
            if [ -d "$kf6_dir" ]; then
              CMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH:$kf6_dir"
            fi
          done
        fi
        
        # Add base paths
        CMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH:$(brew --prefix)/lib/cmake:$(brew --prefix)"
        
        echo "CMAKE_PREFIX_PATH=$CMAKE_PREFIX_PATH" >> $GITHUB_ENV
        echo "Final CMAKE_PREFIX_PATH: $CMAKE_PREFIX_PATH"
        
        # Verify available KF6 components
        echo ""
        echo "=== Available KF6 components ==="
        find "$(brew --prefix)" -name "*KF6*Config.cmake" 2>/dev/null | sort || echo "No KF6 Config files found"

    - name: Prepare conditional CMakeLists.txt
      run: |
        echo "=== Preparing conditional CMakeLists.txt for available components ==="
        
        # Create backup
        if [ ! -f "CMakeLists.txt.original" ]; then
          cp CMakeLists.txt CMakeLists.txt.original
        fi
        
        # Create a conditional CMakeLists.txt that adapts to available components
        cat > CMakeLists_conditional.txt << 'EOF'
        # Enhanced conditional KF6 detection
        
        # Essential components (required for core functionality)
        find_package(KF6CoreAddons REQUIRED)
        find_package(KF6Config REQUIRED)
        
        # Optional components (graceful degradation)
        find_package(KF6I18n QUIET)
        find_package(KF6XmlGui QUIET)
        find_package(KF6IconThemes QUIET)
        find_package(KF6FileMetaData QUIET)
        find_package(KF6Completion QUIET)
        
        # Set up conditional compilation flags
        if(KF6I18n_FOUND)
            add_definitions(-DKATALOG_HAS_KI18N)
            message(STATUS "✅ KF6I18n found - using KLocalizedString")
        else()
            message(STATUS "⚠️  KF6I18n not found - using Qt tr() fallback")
        endif()
        
        if(KF6XmlGui_FOUND)
            add_definitions(-DKATALOG_HAS_KXMLGUI)
            message(STATUS "✅ KF6XmlGui found - using KXmlGuiWindow")
        else()
            add_definitions(-DKATALOG_USE_QMAINWINDOW)
            message(STATUS "⚠️  KF6XmlGui not found - using QMainWindow fallback")
        endif()
        
        if(KF6IconThemes_FOUND)
            add_definitions(-DKATALOG_HAS_KICONTHEMES)
            message(STATUS "✅ KF6IconThemes found - using KIconLoader")
        else()
            message(STATUS "⚠️  KF6IconThemes not found - using Qt standard icons")
        endif()
        
        if(KF6FileMetaData_FOUND)
            add_definitions(-DKATALOG_HAS_KFILEMETADATA)
            message(STATUS "✅ KF6FileMetaData found - enhanced metadata support")
        else()
            message(STATUS "⚠️  KF6FileMetaData not found - basic metadata only")
        endif()
        
        if(KF6Completion_FOUND)
            add_definitions(-DKATALOG_HAS_KCOMPLETION)
            message(STATUS "✅ KF6Completion found - enhanced auto-completion")
        else()
            message(STATUS "⚠️  KF6Completion not found - basic completion")
        endif()
        EOF
        
        # Insert conditional detection after the original find_package statements
        awk '
        /find_package\(KF6/ { skip = 1 }
        /find_package\(KF6.*REQUIRED\)/ && skip { 
          # Skip all KF6 find_package statements
          next
        }
        !skip || /^[[:space:]]*$/ { 
          if (skip) {
            # Insert our conditional detection
            system("cat CMakeLists_conditional.txt")
            skip = 0
          }
          print
        }
        ' CMakeLists.txt.original > CMakeLists.txt
        
        echo "✅ Created conditional CMakeLists.txt"

    - name: Build Katalog
      run: |
        echo "=== Building Katalog with available KF6 components ==="
        
        # Create build directory
        mkdir -p build
        cd build
        
        # Configure with CMake
        echo "Running CMake configuration..."
        if cmake .. \
          -GNinja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
          -DBUILD_TESTS=OFF \
          -DCMAKE_INSTALL_PREFIX=/Applications \
          -DCMAKE_VERBOSE_MAKEFILE=ON; then
          echo "✅ CMake configuration successful"
        else
          echo "❌ CMake configuration failed"
          echo "=== CMake Error Log ==="
          cat CMakeFiles/CMakeError.log 2>/dev/null || echo "No CMake error log available"
          exit 1
        fi
        
        # Build the project
        echo "Building Katalog..."
        if ninja -v; then
          echo "✅ Build successful"
        else
          echo "❌ Build failed"
          exit 1
        fi
        
        # Verify the binary was created
        if [ -f "Katalog" ] || [ -f "Katalog.app/Contents/MacOS/Katalog" ]; then
          echo "✅ Katalog binary created successfully"
        else
          echo "❌ Katalog binary not found"
          ls -la . | head -20
          exit 1
        fi

    - name: Create macOS App Bundle (optional)
      continue-on-error: true
      run: |
        echo "=== Creating macOS App Bundle ==="
        cd build
        
        # Install to create app bundle
        if ninja install; then
          echo "✅ App bundle created successfully"
          ls -la /Applications/Katalog* 2>/dev/null || echo "App bundle not found in Applications"
        else
          echo "⚠️  App bundle creation failed, but binary is available"
        fi

    - name: Build Summary
      run: |
        echo "========================================="
        echo "=== Final Build Summary ==="
        echo "========================================="
        echo "Homebrew KF6 Success: $HOMEBREW_KF6_SUCCESS"
        echo "Essential KF6 Ready: $ESSENTIAL_KF6_READY"
        echo "Available Homebrew KF6 Packages: $HOMEBREW_KF6_PACKAGES"
        
        echo ""
        echo "KF6 Components Status:"
        find "$(brew --prefix)" -name "*KF6*Config.cmake" 2>/dev/null | while read config; do
          component=$(basename "$config" | sed 's/KF6//g' | sed 's/Config.cmake//g')
          echo "  ✅ $component"
        done
        
        echo ""
        echo "Build artifacts:"
        if [ -f "build/Katalog" ]; then
          echo "  ✅ Katalog binary: build/Katalog"
        fi
        if [ -d "/Applications/Katalog.app" ]; then
          echo "  ✅ App bundle: /Applications/Katalog.app"
        fi
        
        echo ""
        echo "✅ macOS Qt6/KF6 build completed successfully!"
