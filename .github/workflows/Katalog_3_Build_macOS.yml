name: Katalog 3 - Build macOS
#v3.alpha2 run1
on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag'
        required: false
        default: 'v3.0-macos'

  # push:
  #   branches: [ main, katalog_master, katalog_development ]

jobs:
  build-macos-k3:
    runs-on: macos-14  # macOS Sonoma (Apple Silicon)

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install base dependencies
      run: |
        echo "=== Installing build tools ==="
        brew update

        if ! command -v cmake >/dev/null 2>&1; then brew install cmake; fi
        if ! command -v ninja >/dev/null 2>&1; then brew install ninja; fi

        # The individual Qt modules, NOT the umbrella qt@6 formula. qt@6 is an
        # alias for "qt", which depends on all 38 Qt modules including
        # qtwebengine - and qtwebengine has no prebuilt bottle for this runner's
        # macOS ("Tier 3 configuration"), so brew tried to compile it from source
        # and the job died. Katalog uses none of WebEngine. Components needed:
        # Core/Widgets/Gui/Sql/Network (qtbase), Charts (qtcharts),
        # LinguistTools (qttools), Quick/QuickControls2 (qtdeclarative), plus
        # qtsvg and qt5compat for Kirigami.
        echo "Installing Qt6 modules (without the WebEngine-pulling umbrella)..."
        for qt_mod in qtbase qtdeclarative qtsvg qtcharts qttools qt5compat qtimageformats; do
          if brew list "$qt_mod" >/dev/null 2>&1; then
            echo "  already present: $qt_mod"
          else
            brew install "$qt_mod"
          fi
        done

        brew install extra-cmake-modules || echo "extra-cmake-modules install failed"
        brew install git wget python3 || echo "Some tools already installed"

        # Try KDE Homebrew tap for KF6 packages
        brew tap kde-mac/kde https://invent.kde.org/packaging/homebrew-kde.git || echo "KDE tap failed"

        # K3-specific KF6 packages (no KXmlGui/KCompletion; needs KArchive + Kirigami)
        # kf6-kfilemetadata is required because katalog-core includes KFileMetaData headers
        for kf6_pkg in kf6-kcoreaddons kf6-ki18n kf6-kconfig kf6-kiconthemes kf6-karchive kf6-kirigami kf6-kfilemetadata; do
          if brew install "$kf6_pkg" 2>/dev/null; then
            echo "✅ Installed $kf6_pkg via Homebrew"
          else
            echo "❌ Failed to install $kf6_pkg via Homebrew - will build from source"
          fi
        done

        if ! command -v magick >/dev/null 2>&1; then
          brew install imagemagick || true
        fi

    - name: Set Qt6 environment
      run: |
        echo "$(brew --prefix)/bin" >> $GITHUB_PATH
        echo "CMAKE_PREFIX_PATH=$(brew --prefix)" >> $GITHUB_ENV
        echo "Qt6_DIR=$(brew --prefix)/lib/cmake/Qt6" >> $GITHUB_ENV
        echo "CMAKE_BUILD_PARALLEL_LEVEL=$(sysctl -n hw.ncpu)" >> $GITHUB_ENV

    - name: Build KF6 from source (if Homebrew install failed)
      run: |
        echo "=== Building required KF6 components from source ==="

        KF6_VERSION="v6.22.0"
        mkdir -p ~/kf6-build
        cd ~/kf6-build

        # CMAKE_PREFIX_PATH must include $(brew --prefix) so that each component
        # can find the KF6 packages built earlier in the same loop (they are all
        # installed to $(brew --prefix)/lib/cmake/KF6*/). Without this, kfilemetadata
        # cannot find KCoreAddons/KI18n/KConfig that were built just before it.
        CMAKE_ARGS=(
          "-DCMAKE_PREFIX_PATH=$(brew --prefix)"
          "-DCMAKE_BUILD_TYPE=Release"
          "-DCMAKE_INSTALL_PREFIX=$(brew --prefix)"
          "-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0"
          "-DBUILD_TESTING=OFF"
          "-DBUILD_QCH=OFF"
          "-DQT_MAJOR_VERSION=6"
        )

        # K3 needs: KCoreAddons, KI18n, KConfig, KIconThemes, KArchive, Kirigami
        # Skip components that Homebrew already installed successfully
        KF6_COMPONENTS=(
          "extra-cmake-modules"
          "kcoreaddons" "ki18n" "kconfig" "kwidgetsaddons"
          "kcodecs" "kguiaddons" "kcolorscheme" "kitemviews" "karchive"
          "kconfigwidgets" "kiconthemes" "kfilemetadata" "kirigami"
        )

        for component in "${KF6_COMPONENTS[@]}"; do
          # Skip if already installed via Homebrew
          # ${component^} (bash 4+ only) not available on macOS bash 3.2 — use awk
          component_cap=$(echo "$component" | awk '{print toupper(substr($0,1,1)) substr($0,2)}')
          if pkg-config --exists "KF6${component_cap}" 2>/dev/null; then
            echo "⏭ Skipping $component (already installed)"
            continue
          fi

          echo "=== Building $component ==="
          if [ "$component" = "extra-cmake-modules" ]; then
            REPO_URL="https://invent.kde.org/frameworks/extra-cmake-modules.git"
          elif [ "$component" = "kirigami" ]; then
            REPO_URL="https://invent.kde.org/frameworks/kirigami.git"
          else
            REPO_URL="https://invent.kde.org/frameworks/$component.git"
          fi

          rm -rf "$component"
          if ! git clone "$REPO_URL" "$component" --depth=1 --branch "$KF6_VERSION" 2>&1; then
            if ! git clone "$REPO_URL" "$component" --depth=1 2>&1; then
              echo "❌ Failed to clone $component"
              continue
            fi
          fi

          if [ "$component" = "kiconthemes" ]; then
            sed -i.bak 's/find_package(KF6BreezeIcons/# PATCHED: find_package(KF6BreezeIcons/g' "$component/CMakeLists.txt"
            sed -i.bak2 's/BreezeIcons::initIcons();/\/\/ PATCHED: BreezeIcons::initIcons();/g' "$component/src/kicontheme.cpp" 2>/dev/null || true
          fi

          cd "$component"
          rm -rf build && mkdir build && cd build

          if cmake .. "${CMAKE_ARGS[@]}" 2>&1 | tail -5; then
            if make -j$(sysctl -n hw.ncpu) 2>&1 | tail -5 && make install 2>&1 | tail -3; then
              echo "✅ Built and installed $component"
            else
              echo "❌ Build/install failed for $component"
            fi
          else
            echo "❌ CMake failed for $component"
          fi

          cd ~/kf6-build
        done

    - name: Set version information
      run: |
        KATALOG_VERSION=$(grep -E "^project\(Katalog3 VERSION" qt_quick/CMakeLists.txt | sed -E 's/.*VERSION ([0-9.]+).*/\1/')
        if [ -z "$KATALOG_VERSION" ]; then
          KATALOG_VERSION="3.x"
        fi
        echo "VERSION_TAG=macos_v${KATALOG_VERSION}" >> $GITHUB_ENV
        echo "KATALOG_VERSION=${KATALOG_VERSION}" >> $GITHUB_ENV
        echo "Building version: macos_v${KATALOG_VERSION}"

    - name: Build Katalog 3
      run: |
        mkdir build && cd build

        # Build comprehensive CMAKE_PREFIX_PATH
        BASE_PATHS="$(brew --prefix)/lib/cmake:$(brew --prefix)"
        export CMAKE_PREFIX_PATH="$BASE_PATHS"

        echo "=== Running CMake configuration ==="
        cmake .. \
          -GNinja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
          -DBUILD_TESTS=OFF \
          -DBUILD_QT_WIDGETS=OFF \
          -DBUILD_QT_QUICK=ON \
          -DCMAKE_INSTALL_PREFIX=/Applications

        # Build translations
        ninja translations_lrelease || ninja Katalog3_lrelease || echo "Translation build skipped"

        # Build main application
        if ninja; then
          echo "✅ Build successful!"
        else
          echo "❌ Build failed"
          exit 1
        fi

        echo "=== Build output ==="
        find . -name "Katalog*" -o -name "*.app" | sort

        if [ -f "qt_quick/Katalog.app/Contents/MacOS/Katalog" ]; then
          echo "✅ Katalog3 app bundle found"
        else
          echo "❌ Katalog3 app bundle not found"
          exit 1
        fi

        # Which processor this build actually runs on. Recorded rather than
        # enforced: no CMAKE_OSX_ARCHITECTURES is set, so the build is native to
        # the runner (macos-14 = Apple Silicon) and will NOT start on an Intel
        # Mac. When a user reports "it does not start", this line says in one
        # glance whether that build could ever have run on their machine.
        ARCHS=$(lipo -archs qt_quick/Katalog.app/Contents/MacOS/Katalog 2>/dev/null || echo "unknown")
        echo "=== Binary architecture: ${ARCHS} ==="
        echo "### macOS build" >> $GITHUB_STEP_SUMMARY
        echo "- **Architecture**: ${ARCHS}" >> $GITHUB_STEP_SUMMARY
        if ! echo "$ARCHS" | grep -q "x86_64"; then
          echo "- ⚠️ Intel Macs are **not** supported by this build" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Deploy Qt6 dependencies
      run: |
        cd build
        QT_DEPLOY_TOOL="$(brew --prefix)/bin/macdeployqt"
        if [ -x "$QT_DEPLOY_TOOL" ]; then
          "$QT_DEPLOY_TOOL" qt_quick/Katalog.app -verbose=1 || echo "macdeployqt completed with warnings"
        else
          echo "macdeployqt not found"
        fi

        # Without the Cocoa platform plugin a Qt app aborts at startup with
        # "no Qt platform plugin could be initialized" - one of the classic
        # "it does not even start" reports. It cannot be caught by running the
        # app on this runner, where Qt is installed system-wide and would be
        # found anyway; only the bundle's own copy matters on a user's Mac.
        # macdeployqt is allowed to fail softly above (|| echo), so this is the
        # check that decides whether the bundle is shippable.
        COCOA_PLUGIN="qt_quick/Katalog.app/Contents/PlugIns/platforms/libqcocoa.dylib"
        echo "=== Bundled Qt plugins ==="
        ls -R qt_quick/Katalog.app/Contents/PlugIns 2>/dev/null || echo "(no PlugIns directory)"
        if [ -f "$COCOA_PLUGIN" ]; then
          echo "✅ Cocoa platform plugin bundled"
          echo "- **Platform plugin**: bundled" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ $COCOA_PLUGIN is missing - the app would not start on a user's Mac"
          echo "- **Platform plugin**: MISSING - build rejected" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

    - name: Verify the bundle is self-contained
      run: |
        cd build
        APP="qt_quick/Katalog.app"

        # Every Mach-O file in the bundle is asked what it links against. A
        # dependency under /opt/homebrew, /usr/local or a home directory exists
        # on this runner and NOT on a user's Mac, so the app would fail to start
        # there with a dyld error - the failure a user can only describe as "it
        # does not open". @rpath, @executable_path and @loader_path resolve
        # inside the bundle and are fine; /usr/lib and /System/Library are part
        # of macOS itself.
        echo "=== Checking linked libraries ==="
        BAD_FILES=0
        for f in $(find "$APP" -type f); do
          case "$(file -b "$f")" in
            *Mach-O*) ;;
            *) continue ;;
          esac
          # A library's OWN install name (LC_ID_DYLIB) is printed by otool -L
          # as its first entry, before the real dependencies, and macdeployqt
          # commonly leaves it as the original Homebrew path. That is harmless:
          # dyld resolves a dependency through the path recorded in the
          # REFERENCING binary, not through the library's own id. Only genuine
          # dependencies are checked here, so the id is excluded first.
          OWN_ID=$(otool -D "$f" 2>/dev/null | tail -n +2 | head -1)
          DEPS=$(otool -L "$f" 2>/dev/null | tail -n +2 | awk '{print $1}')
          if [ -n "$OWN_ID" ]; then
            DEPS=$(echo "$DEPS" | grep -v -x -F "$OWN_ID" || true)
          fi
          REFS=$(echo "$DEPS" | grep -E '^(/opt/homebrew|/usr/local|/Users/|/opt/local)' || true)
          if [ -n "$REFS" ]; then
            echo "❌ ${f#$APP/} depends on paths outside the bundle:"
            echo "$REFS" | sed 's/^/       /'
            BAD_FILES=$((BAD_FILES + 1))
          fi
        done

        if [ "$BAD_FILES" -eq 0 ]; then
          echo "✅ Every linked library resolves inside the bundle or in macOS itself"
          echo "- **Self-contained**: yes" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ $BAD_FILES file(s) reference libraries that only exist on this build machine."
          echo "   This DMG would not start on a user's Mac."
          echo "- **Self-contained**: NO - $BAD_FILES file(s) link outside the bundle" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

    - name: Create DMG
      run: |
        cd build
        DMG_NAME="Katalog-$VERSION_TAG-macOS.dmg"
        mkdir dmg_temp
        cp -R qt_quick/Katalog.app dmg_temp/

        if command -v create-dmg >/dev/null 2>&1; then
          create-dmg \
            --volname "Katalog $VERSION_TAG" \
            --window-pos 200 120 \
            --window-size 600 300 \
            --icon-size 100 \
            --icon "Katalog.app" 175 120 \
            --hide-extension "Katalog.app" \
            --app-drop-link 425 120 \
            "$DMG_NAME" \
            "dmg_temp/" || true
        fi

        # Fallback if create-dmg failed or not installed
        if [ ! -f "$DMG_NAME" ]; then
          hdiutil create -srcfolder qt_quick/Katalog.app -format UDZO -o "$DMG_NAME"
        fi

        echo "DMG created: $DMG_NAME"
        ls -lh *.dmg

    - name: Upload DMG as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Katalog_${{ env.VERSION_TAG }}_dmg
        path: build/Katalog-${{ env.VERSION_TAG }}-macOS.dmg
        retention-days: 30

    - name: Upload App Bundle as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Katalog_${{ env.VERSION_TAG }}_bundle
        path: build/qt_quick/Katalog.app
        retention-days: 7

    - name: Summary
      run: |
        echo "## Katalog 3 macOS Build" >> $GITHUB_STEP_SUMMARY
        echo "- **Version**: ${{ env.VERSION_TAG }}" >> $GITHUB_STEP_SUMMARY
        echo "- **File**: Katalog-${{ env.VERSION_TAG }}-macOS.dmg" >> $GITHUB_STEP_SUMMARY
        echo "- **Status**: 📦 Available as build artifact" >> $GITHUB_STEP_SUMMARY
