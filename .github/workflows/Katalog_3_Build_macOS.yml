name: Katalog 3 - Build macOS
#v3.0.beta2 run1
on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag'
        required: false
        default: 'v3.0-macos'

  # push:
  #   branches: [ main, katalog_master, katalog_development ]

jobs:
  build-macos-k3:
    runs-on: macos-14  # macOS Sonoma (Apple Silicon)

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install base dependencies
      run: |
        echo "=== Installing build tools ==="
        brew update

        if ! command -v cmake >/dev/null 2>&1; then brew install cmake; fi
        if ! command -v ninja >/dev/null 2>&1; then brew install ninja; fi

        # The individual Qt modules, NOT the umbrella qt@6 formula. qt@6 is an
        # alias for "qt", which depends on all 38 Qt modules including
        # qtwebengine - and qtwebengine has no prebuilt bottle for this runner's
        # macOS ("Tier 3 configuration"), so brew tried to compile it from source
        # and the job died. Katalog uses none of WebEngine. Components needed:
        # Core/Widgets/Gui/Sql/Network (qtbase), Charts (qtcharts),
        # LinguistTools (qttools), Quick/QuickControls2 (qtdeclarative), plus
        # qtsvg and qt5compat for Kirigami.
        echo "Installing Qt6 modules (without the WebEngine-pulling umbrella)..."
        for qt_mod in qtbase qtdeclarative qtsvg qtcharts qttools qt5compat qtimageformats; do
          if brew list "$qt_mod" >/dev/null 2>&1; then
            echo "  already present: $qt_mod"
          else
            brew install "$qt_mod"
          fi
        done

        brew install extra-cmake-modules || echo "extra-cmake-modules install failed"
        brew install git wget python3 || echo "Some tools already installed"

        # Try KDE Homebrew tap for KF6 packages
        brew tap kde-mac/kde https://invent.kde.org/packaging/homebrew-kde.git || echo "KDE tap failed"

        # K3-specific KF6 packages (no KXmlGui/KCompletion; needs KArchive + Kirigami)
        # kf6-kfilemetadata is required because katalog-core includes KFileMetaData headers
        for kf6_pkg in kf6-kcoreaddons kf6-ki18n kf6-kconfig kf6-kiconthemes kf6-karchive kf6-kirigami kf6-kfilemetadata; do
          if brew install "$kf6_pkg" 2>/dev/null; then
            echo "✅ Installed $kf6_pkg via Homebrew"
          else
            echo "❌ Failed to install $kf6_pkg via Homebrew - will build from source"
          fi
        done

        if ! command -v magick >/dev/null 2>&1; then
          brew install imagemagick || true
        fi

    - name: Set Qt6 environment
      run: |
        echo "$(brew --prefix)/bin" >> $GITHUB_PATH
        echo "CMAKE_PREFIX_PATH=$(brew --prefix)" >> $GITHUB_ENV
        echo "Qt6_DIR=$(brew --prefix)/lib/cmake/Qt6" >> $GITHUB_ENV
        echo "CMAKE_BUILD_PARALLEL_LEVEL=$(sysctl -n hw.ncpu)" >> $GITHUB_ENV

    - name: Build KF6 from source (if Homebrew install failed)
      run: |
        echo "=== Building required KF6 components from source ==="

        KF6_VERSION="v6.22.0"
        mkdir -p ~/kf6-build
        cd ~/kf6-build

        # CMAKE_PREFIX_PATH must include $(brew --prefix) so that each component
        # can find the KF6 packages built earlier in the same loop (they are all
        # installed to $(brew --prefix)/lib/cmake/KF6*/). Without this, kfilemetadata
        # cannot find KCoreAddons/KI18n/KConfig that were built just before it.
        CMAKE_ARGS=(
          "-DCMAKE_PREFIX_PATH=$(brew --prefix)"
          "-DCMAKE_BUILD_TYPE=Release"
          "-DCMAKE_INSTALL_PREFIX=$(brew --prefix)"
          "-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0"
          "-DBUILD_TESTING=OFF"
          "-DBUILD_QCH=OFF"
          "-DQT_MAJOR_VERSION=6"
        )

        # K3 needs: KCoreAddons, KI18n, KConfig, KIconThemes, KArchive, Kirigami
        # Skip components that Homebrew already installed successfully
        KF6_COMPONENTS=(
          "extra-cmake-modules"
          "kcoreaddons" "ki18n" "kconfig" "kwidgetsaddons"
          "kcodecs" "kguiaddons" "kcolorscheme" "kitemviews" "karchive"
          "kconfigwidgets" "kiconthemes" "kfilemetadata" "kirigami"
        )

        for component in "${KF6_COMPONENTS[@]}"; do
          # Skip if already installed via Homebrew
          # ${component^} (bash 4+ only) not available on macOS bash 3.2 — use awk
          component_cap=$(echo "$component" | awk '{print toupper(substr($0,1,1)) substr($0,2)}')
          if pkg-config --exists "KF6${component_cap}" 2>/dev/null; then
            echo "⏭ Skipping $component (already installed)"
            continue
          fi

          echo "=== Building $component ==="
          if [ "$component" = "extra-cmake-modules" ]; then
            REPO_URL="https://invent.kde.org/frameworks/extra-cmake-modules.git"
          elif [ "$component" = "kirigami" ]; then
            REPO_URL="https://invent.kde.org/frameworks/kirigami.git"
          else
            REPO_URL="https://invent.kde.org/frameworks/$component.git"
          fi

          rm -rf "$component"
          if ! git clone "$REPO_URL" "$component" --depth=1 --branch "$KF6_VERSION" 2>&1; then
            if ! git clone "$REPO_URL" "$component" --depth=1 2>&1; then
              echo "❌ Failed to clone $component"
              continue
            fi
          fi

          if [ "$component" = "kiconthemes" ]; then
            sed -i.bak 's/find_package(KF6BreezeIcons/# PATCHED: find_package(KF6BreezeIcons/g' "$component/CMakeLists.txt"
            sed -i.bak2 's/BreezeIcons::initIcons();/\/\/ PATCHED: BreezeIcons::initIcons();/g' "$component/src/kicontheme.cpp" 2>/dev/null || true
          fi

          cd "$component"
          rm -rf build && mkdir build && cd build

          if cmake .. "${CMAKE_ARGS[@]}" 2>&1 | tail -5; then
            if make -j$(sysctl -n hw.ncpu) 2>&1 | tail -5 && make install 2>&1 | tail -3; then
              echo "✅ Built and installed $component"
            else
              echo "❌ Build/install failed for $component"
            fi
          else
            echo "❌ CMake failed for $component"
          fi

          cd ~/kf6-build
        done

    - name: Set version information
      run: |
        # Read the full release string (it carries any beta/alpha suffix); project()
        # holds only major.minor, which would silently drop the pre-release marker.
        KATALOG_VERSION=$(grep -E '^set\(KATALOG_VERSION_STRING' qt_quick/CMakeLists.txt \
          | sed -E 's/.*"([^"]+)".*/\1/')
        if [ -z "$KATALOG_VERSION" ]; then
          KATALOG_VERSION="3.x"
        fi
        echo "ARTIFACT_BASE=Katalog_macos_v${KATALOG_VERSION}" >> $GITHUB_ENV
        echo "KATALOG_VERSION=${KATALOG_VERSION}" >> $GITHUB_ENV
        echo "Building artifact: Katalog_macos_v${KATALOG_VERSION}.dmg"

    - name: Build Katalog 3
      run: |
        mkdir build && cd build

        # Build comprehensive CMAKE_PREFIX_PATH
        BASE_PATHS="$(brew --prefix)/lib/cmake:$(brew --prefix)"
        export CMAKE_PREFIX_PATH="$BASE_PATHS"

        echo "=== Running CMake configuration ==="
        cmake .. \
          -GNinja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
          -DBUILD_TESTS=OFF \
          -DBUILD_QT_WIDGETS=OFF \
          -DBUILD_QT_QUICK=ON \
          -DCMAKE_INSTALL_PREFIX=/Applications

        # Build translations
        ninja translations_lrelease || ninja Katalog3_lrelease || echo "Translation build skipped"

        # Build main application
        if ninja; then
          echo "✅ Build successful!"
        else
          echo "❌ Build failed"
          exit 1
        fi

        echo "=== Build output ==="
        find . -name "Katalog*" -o -name "*.app" | sort

        if [ -f "qt_quick/Katalog.app/Contents/MacOS/Katalog" ]; then
          echo "✅ Katalog3 app bundle found"
        else
          echo "❌ Katalog3 app bundle not found"
          exit 1
        fi

        # Which processor this build actually runs on. Recorded rather than
        # enforced: no CMAKE_OSX_ARCHITECTURES is set, so the build is native to
        # the runner (macos-14 = Apple Silicon) and will NOT start on an Intel
        # Mac. When a user reports "it does not start", this line says in one
        # glance whether that build could ever have run on their machine.
        ARCHS=$(lipo -archs qt_quick/Katalog.app/Contents/MacOS/Katalog 2>/dev/null || echo "unknown")
        echo "=== Binary architecture: ${ARCHS} ==="
        echo "### macOS build" >> $GITHUB_STEP_SUMMARY
        echo "- **Architecture**: ${ARCHS}" >> $GITHUB_STEP_SUMMARY
        if ! echo "$ARCHS" | grep -q "x86_64"; then
          echo "- ⚠️ Intel Macs are **not** supported by this build" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Deploy Qt6 dependencies
      run: |
        cd build
        QT_DEPLOY_TOOL="$(brew --prefix)/bin/macdeployqt"
        if [ -x "$QT_DEPLOY_TOOL" ]; then
          # -qmldir is NOT optional for a Qt Quick app. Without it macdeployqt
          # never scans the QML, so no QML module is bundled and the app dies at
          # startup with: module "QtQuick.Controls" plugin
          # "qtquickcontrols2plugin" not found. The libraries and the platform
          # plugin are all present in that state, which is why the earlier
          # checks passed while the app could not start at all.
          "$QT_DEPLOY_TOOL" qt_quick/Katalog.app -qmldir=../qt_quick -verbose=1 \
            || echo "macdeployqt completed with warnings"
        else
          echo "macdeployqt not found"
        fi

        # The QML modules land here. Their absence is what made the app
        # unstartable, so it is checked rather than assumed.
        QML_DIR="qt_quick/Katalog.app/Contents/Resources/qml"
        if [ -d "$QML_DIR" ]; then
          echo "✅ QML modules bundled: $(find "$QML_DIR" -name '*.dylib' | wc -l | tr -d ' ') plugin(s)"
          echo "- **QML modules**: bundled" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ No QML modules in the bundle - the app cannot load its interface"
          echo "- **QML modules**: MISSING - build rejected" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

        # Without the Cocoa platform plugin a Qt app aborts at startup with
        # "no Qt platform plugin could be initialized" - one of the classic
        # "it does not even start" reports. It cannot be caught by running the
        # app on this runner, where Qt is installed system-wide and would be
        # found anyway; only the bundle's own copy matters on a user's Mac.
        # macdeployqt is allowed to fail softly above (|| echo), so this is the
        # check that decides whether the bundle is shippable.
        COCOA_PLUGIN="qt_quick/Katalog.app/Contents/PlugIns/platforms/libqcocoa.dylib"
        echo "=== Bundled Qt plugins ==="
        ls -R qt_quick/Katalog.app/Contents/PlugIns 2>/dev/null || echo "(no PlugIns directory)"
        # Katalog cannot open any collection without the SQLite driver. Unlike
        # the platform plugin, its absence does not stop the app starting - it
        # would launch and then fail on every database operation, which a user
        # reports as "it does not work" rather than "it does not start".
        SQLITE_PLUGIN="qt_quick/Katalog.app/Contents/PlugIns/sqldrivers/libqsqlite.dylib"
        if [ -f "$SQLITE_PLUGIN" ]; then
          echo "✅ SQLite driver bundled"
          echo "- **SQLite driver**: bundled" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ $SQLITE_PLUGIN is missing - no collection could be opened"
          echo "- **SQLite driver**: MISSING - build rejected" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

        if [ -f "$COCOA_PLUGIN" ]; then
          echo "✅ Cocoa platform plugin bundled"
          echo "- **Platform plugin**: bundled" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ $COCOA_PLUGIN is missing - the app would not start on a user's Mac"
          echo "- **Platform plugin**: MISSING - build rejected" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

    - name: Verify the bundle is self-contained
      run: |
        cd build
        APP="qt_quick/Katalog.app"

        # Every Mach-O file in the bundle is asked what it links against. A
        # dependency under /opt/homebrew, /usr/local or a home directory exists
        # on this runner and NOT on a user's Mac, so the app would fail to start
        # there with a dyld error - the failure a user can only describe as "it
        # does not open". @rpath, @executable_path and @loader_path resolve
        # inside the bundle and are fine; /usr/lib and /System/Library are part
        # of macOS itself.
        echo "=== Checking linked libraries ==="
        BAD_FILES=0
        CHECKED=0
        for f in $(find "$APP" -type f); do
          case "$(file -b "$f")" in
            *Mach-O*) CHECKED=$((CHECKED + 1)) ;;
            *) continue ;;
          esac
          # A library's OWN install name (LC_ID_DYLIB) is printed by otool -L
          # as its first entry, before the real dependencies, and macdeployqt
          # commonly leaves it as the original Homebrew path. That is harmless:
          # dyld resolves a dependency through the path recorded in the
          # REFERENCING binary, not through the library's own id. Only genuine
          # dependencies are checked here, so the id is excluded first.
          OWN_ID=$(otool -D "$f" 2>/dev/null | tail -n +2 | head -1)
          DEPS=$(otool -L "$f" 2>/dev/null | tail -n +2 | awk '{print $1}')
          if [ -n "$OWN_ID" ]; then
            DEPS=$(echo "$DEPS" | grep -v -x -F "$OWN_ID" || true)
          fi
          REFS=$(echo "$DEPS" | grep -E '^(/opt/homebrew|/usr/local|/Users/|/opt/local)' || true)
          if [ -n "$REFS" ]; then
            echo "❌ ${f#$APP/} depends on paths outside the bundle:"
            echo "$REFS" | sed 's/^/       /'
            BAD_FILES=$((BAD_FILES + 1))
          fi
        done

        echo "Mach-O files examined: $CHECKED"
        # A path mistake would examine nothing and report success, so an empty
        # sweep is itself a failure.
        if [ "$CHECKED" -lt 10 ]; then
          echo "❌ Only $CHECKED Mach-O file(s) examined - the bundle path is wrong, this is not a clean result"
          exit 1
        fi

        if [ "$BAD_FILES" -eq 0 ]; then
          echo "✅ Every linked library resolves inside the bundle or in macOS itself ($CHECKED files)"
          echo "- **Self-contained**: yes ($CHECKED binaries checked)" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ $BAD_FILES file(s) reference libraries that only exist on this build machine."
          echo "   This DMG would not start on a user's Mac."
          echo "- **Self-contained**: NO - $BAD_FILES file(s) link outside the bundle" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

    - name: Sign the bundle (ad-hoc) and verify it
      run: |
        cd build
        APP="qt_quick/Katalog.app"

        # An ad-hoc signature - "-" means no identity, no Apple account needed.
        # Two reasons it matters, neither of them notarization:
        #  1. On Apple Silicon every executable must carry a valid signature to
        #     run at all. macdeployqt rewrites install names with
        #     install_name_tool, which invalidates whatever signature a binary
        #     arrived with; signing afterwards makes that independent of what a
        #     given Qt version happens to re-sign on its own.
        #  2. At Gatekeeper a broken or absent signature produces "Katalog is
        #     damaged and can't be opened", which reads as unfixable, whereas a
        #     valid ad-hoc one produces "unverified developer", which the
        #     documented right-click-Open works around.
        # It is NOT notarization: a downloaded build is still warned about.
        echo "=== Signing ==="
        codesign --force --deep --sign - --timestamp=none "$APP"

        echo "=== Verifying ==="
        if codesign --verify --deep --strict --verbose=2 "$APP" 2>&1; then
          echo "✅ Signature valid for the bundle and everything nested in it"
          echo "- **Code signature**: valid (ad-hoc, not notarized)" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ The bundle does not carry a valid signature - on Apple Silicon it may be killed at launch"
          echo "- **Code signature**: INVALID - build rejected" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

        # Reported, never enforced: this fails by definition until the app is
        # notarized with a paid Developer ID, so failing the build on it would
        # block every release for a condition we have chosen to accept.
        echo "=== Gatekeeper assessment (expected to fail without notarization) ==="
        spctl --assess --type execute --verbose=4 "$APP" 2>&1 || true

    - name: Smoke test - start the app without Homebrew
      run: |
        cd build
        APP="qt_quick/Katalog.app"

        # The previous step reads what the binaries declare; this one actually
        # runs the app. Homebrew is moved aside first, because otherwise a
        # library missing from the bundle would quietly resolve from
        # /opt/homebrew - which exists here and on no user's Mac. This is the
        # closest a build machine gets to looking like the machine a user
        # downloads onto.
        sudo mv /opt/homebrew /opt/homebrew.hidden
        echo "=== Homebrew hidden, starting the app ==="

        set +e
        "$APP/Contents/MacOS/Katalog" > launch.log 2>&1 &
        APP_PID=$!
        sleep 20
        if kill -0 "$APP_PID" 2>/dev/null; then
          STILL_RUNNING=1
          kill "$APP_PID" 2>/dev/null
        else
          STILL_RUNNING=0
        fi
        wait "$APP_PID" 2>/dev/null
        set -e

        sudo mv /opt/homebrew.hidden /opt/homebrew
        echo "=== Homebrew restored ==="

        echo "=== Application output ==="
        cat launch.log || true

        # A dyld failure is the defect this whole exercise is about: a library
        # the bundle does not carry. Anything else that stops the app here may
        # be the runner having no user session rather than a broken bundle, so
        # it is reported without failing the build - a false red would be worse
        # than no check.
        # Widened after a run where the app failed with 'plugin
        # "qtquickcontrols2plugin" not found' and this check called it
        # inconclusive: a missing QML module, an unloadable plugin or a database
        # driver that will not load all stop the application just as dead as a
        # missing library, and none of them mentions dyld.
        # "Driver not loaded" is deliberately NOT in this list. This runner has
        # no settings file and no collection, so Database::initialize returns
        # early ("Not configured yet; first-run flow will set the path",
        # core/database.cpp) and no database is ever added - every later query
        # then reports that. It is correct first-run behaviour, not a missing
        # SQLite plugin, and the plugin's presence is checked at deploy time
        # instead, where it can actually be judged.
        if grep -qE "Library not loaded|dyld|image not found|failed to load component|plugin .* not found|no Qt platform plugin could be initialized" launch.log; then
          echo "❌ The app could not start with only the bundle to rely on."
          echo "   That is exactly what a user's Mac would do."
          echo "- **Starts without Homebrew**: NO - see the log" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

        if [ "$STILL_RUNNING" -eq 1 ]; then
          echo "✅ The app started and was still running after 20s with no Homebrew present"
          echo "- **Starts without Homebrew**: yes" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ The app exited early, but not with a library error - see the output above."
          echo "   Inconclusive rather than failed: a headless runner can stop a GUI app for reasons"
          echo "   that have nothing to do with the bundle."
          echo "- **Starts without Homebrew**: inconclusive - exited early, no library error" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Create DMG
      run: |
        cd build
        DMG_NAME="${ARTIFACT_BASE}.dmg"
        mkdir dmg_temp
        cp -R qt_quick/Katalog.app dmg_temp/

        if command -v create-dmg >/dev/null 2>&1; then
          create-dmg \
            --volname "Katalog $KATALOG_VERSION" \
            --window-pos 200 120 \
            --window-size 600 300 \
            --icon-size 100 \
            --icon "Katalog.app" 175 120 \
            --hide-extension "Katalog.app" \
            --app-drop-link 425 120 \
            "$DMG_NAME" \
            "dmg_temp/" || true
        fi

        # Fallback if create-dmg failed or not installed
        if [ ! -f "$DMG_NAME" ]; then
          hdiutil create -srcfolder qt_quick/Katalog.app -format UDZO -o "$DMG_NAME"
        fi

        echo "DMG created: $DMG_NAME"
        ls -lh *.dmg

    - name: Upload DMG as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARTIFACT_BASE }}_dmg
        path: build/${{ env.ARTIFACT_BASE }}.dmg
        retention-days: 30

    - name: Upload App Bundle as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARTIFACT_BASE }}_bundle
        path: build/qt_quick/Katalog.app
        retention-days: 7

    - name: Summary
      run: |
        echo "## Katalog 3 macOS Build" >> $GITHUB_STEP_SUMMARY
        echo "- **Version**: ${{ env.KATALOG_VERSION }}" >> $GITHUB_STEP_SUMMARY
        echo "- **File**: ${{ env.ARTIFACT_BASE }}.dmg" >> $GITHUB_STEP_SUMMARY
        echo "- **Status**: 📦 Available as build artifact" >> $GITHUB_STEP_SUMMARY
