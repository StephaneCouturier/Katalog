name: Build AppImage

on:
  # Trigger on new releases
  release:
    types: [published]

  # Allow manual triggering
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag (e.g., v2.6.1)'
        required: false
        default: 'dev-build'

  # Optional: trigger on push to main (remove if you don't want this)
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'scripts/Katalog_linux_create_portable.sh'

jobs:
  build-appimage:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Qt6 and KF6 dependencies
      run: |
        # Add KDE neon repository for KF6 packages
        sudo apt-get update
        sudo apt-get install -y software-properties-common wget gpg

        # Add KDE neon repository
        wget -qO - https://archive.neon.kde.org/public.key | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/neon.gpg
        echo "deb http://archive.neon.kde.org/user noble main" | sudo tee /etc/apt/sources.list.d/neon.list

        # Update package lists
        sudo apt-get update

        # Install base dependencies
        sudo apt-get install -y \
          cmake \
          ninja-build \
          desktop-file-utils \
          appstream-util \
          wget \
          file \
          fuse3 \
          libfuse2

        # Install Qt6 packages
        sudo apt-get install -y \
          qt6-base-dev \
          qt6-base-dev-tools \
          qt6-tools-dev \
          qt6-tools-dev-tools \
          qt6-l10n-tools \
          libqt6charts6-dev \
          libqt6sql6-sqlite \
          libqt6networkauth6-dev

        # Install KF6 packages from neon repository
        sudo apt-get install -y \
          libkf6coreaddons-dev \
          libkf6i18n-dev \
          libkf6xmlgui-dev \
          libkf6config-dev \
          libkf6iconthemes-dev || \
        {
          # Fallback: try alternative package names
          echo "Trying alternative KF6 package names..."
          sudo apt-get install -y \
            kf6-kcoreaddons-dev \
            kf6-ki18n-dev \
            kf6-kxmlgui-dev \
            kf6-kconfig-dev \
            kf6-kiconthemes-dev || \
          {
            echo "KF6 packages not available, listing available packages..."
            apt list --installed | grep -i kf6 || true
            apt search kf6 | head -20 || true
            exit 1
          }
        }

    - name: Download and setup linuxdeploy
      run: |
        mkdir -p $HOME/linuxdeploy
        cd $HOME/linuxdeploy

        # Download linuxdeploy and Qt plugin
        wget -c "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
        wget -c "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"

        chmod +x *.AppImage

        # Extract for use in container environment
        ./linuxdeploy-x86_64.AppImage --appimage-extract
        ./linuxdeploy-plugin-qt-x86_64.AppImage --appimage-extract

        # Create convenient symlinks
        ln -sf squashfs-root/AppRun linuxdeploy
        ln -sf squashfs-root-1/AppRun linuxdeploy-plugin-qt

    - name: Create packaging directory and files
      run: |
        mkdir -p packaging

        # Create desktop file
        cat > packaging/Katalog.desktop << EOF
        [Desktop Entry]
        Type=Application
        Name=Katalog
        GenericName=File Catalog Manager
        Comment=Create and manage catalogs of your files and folders
        Comment[fr]=Créer et gérer des catalogues de vos fichiers et dossiers
        Exec=Katalog
        Icon=Katalog
        Terminal=false
        Categories=Utility;FileManager;Qt;
        Keywords=catalog;files;folders;organization;storage;backup;
        StartupNotify=true
        StartupWMClass=Katalog
        EOF

        # Create AppData file
        cat > packaging/io.github.stephanecouturier.katalog.appdata.xml << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <component type="desktop-application">
          <id>io.github.stephanecouturier.katalog</id>
          <name>Katalog</name>
          <summary>File Catalog Manager</summary>
          <description>
            <p>
              Katalog is a file catalog manager that helps you organize and track your files and folders across multiple storage devices.
              Create catalogs of your DVDs, external drives, and folders to quickly find files without having to connect the device.
            </p>
            <p>Features:</p>
            <ul>
              <li>Create catalogs of files and folders</li>
              <li>Search across multiple catalogs</li>
              <li>Track files on external devices</li>
              <li>Import from other catalog formats</li>
              <li>Statistics and file analysis</li>
              <li>Multiple language support</li>
            </ul>
          </description>
          <categories>
            <category>Utility</category>
            <category>FileManager</category>
          </categories>
          <url type="homepage">https://stephanecouturier.github.io/Katalog</url>
          <url type="bugtracker">https://github.com/StephaneCouturier/Katalog/issues</url>
          <url type="help">https://stephanecouturier.github.io/Katalog/docs/tutorial</url>
          <launchable type="desktop-id">io.github.stephanecouturier.katalog.desktop</launchable>
          <provides>
            <binary>Katalog</binary>
          </provides>
          <content_rating type="oars-1.1"/>
          <releases>
            <release version="2.6" date="2024-01-01"/>
          </releases>
        </component>
        EOF

    - name: Set version information
      run: |
        if [ "${{ github.event_name }}" = "release" ]; then
          echo "VERSION_TAG=${{ github.event.release.tag_name }}" >> $GITHUB_ENV
          echo "IS_RELEASE=true" >> $GITHUB_ENV
        elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version_tag }}" ]; then
          echo "VERSION_TAG=${{ github.event.inputs.version_tag }}" >> $GITHUB_ENV
          echo "IS_RELEASE=false" >> $GITHUB_ENV
        else
          echo "VERSION_TAG=dev-$(date +%Y%m%d-%H%M)" >> $GITHUB_ENV
          echo "IS_RELEASE=false" >> $GITHUB_ENV
        fi

        echo "Building version: $VERSION_TAG"

    - name: Build Katalog
      run: |
        mkdir build
        cd build

        cmake .. \
          -GNinja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=/usr \
          -DCMAKE_PREFIX_PATH=/usr \
          -DBUILD_TESTS=OFF

        ninja

        # Install to AppDir
        DESTDIR=$PWD/AppDir ninja install

    - name: Prepare AppDir structure
      run: |
        cd build

        # Ensure proper AppDir structure
        mkdir -p AppDir/usr/share/applications
        mkdir -p AppDir/usr/share/metainfo
        mkdir -p AppDir/usr/share/icons/hicolor/64x64/apps

        # Copy desktop file
        cp ../packaging/Katalog.desktop AppDir/usr/share/applications/

        # Copy AppData
        cp ../packaging/io.github.stephanecouturier.katalog.appdata.xml AppDir/usr/share/metainfo/

        # Extract and copy icon from Qt resources (fallback to a simple icon if extraction fails)
        if [ -f "AppDir/usr/bin/Katalog" ]; then
          # Try to extract icon from compiled resources or use existing icon file
          if [ -f "../src/images/Katalog_logo_64.ico" ]; then
            # Convert ico to png if needed (install imagemagick if needed)
            sudo apt-get install -y imagemagick
            convert "../src/images/Katalog_logo_64.ico[0]" AppDir/usr/share/icons/hicolor/64x64/apps/Katalog.png 2>/dev/null || \
            cp ../src/images/Katalog_logo_64.ico AppDir/usr/share/icons/hicolor/64x64/apps/Katalog.png
          else
            # Create a simple fallback icon
            sudo apt-get install -y imagemagick
            convert -size 64x64 xc:steelblue -gravity center -pointsize 14 -fill white -annotate +0+0 "K" AppDir/usr/share/icons/hicolor/64x64/apps/Katalog.png
          fi
        fi

        # Validate desktop file
        desktop-file-validate AppDir/usr/share/applications/Katalog.desktop || echo "Desktop file validation warnings (non-critical)"

        # Validate AppData
        appstream-util validate AppDir/usr/share/metainfo/io.github.stephanecouturier.katalog.appdata.xml || echo "AppData validation warnings (non-critical)"

    - name: Create AppImage
      run: |
        cd build

        # Set up environment for linuxdeploy
        export PATH="$HOME/linuxdeploy:$PATH"
        export LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH

        # Create AppImage
        linuxdeploy \
          --appdir AppDir \
          --plugin qt \
          --executable AppDir/usr/bin/Katalog \
          --desktop-file AppDir/usr/share/applications/Katalog.desktop \
          --icon-file AppDir/usr/share/icons/hicolor/64x64/apps/Katalog.png \
          --output appimage

        # Rename AppImage with version
        if ls Katalog-*.AppImage 1> /dev/null 2>&1; then
          mv Katalog-*.AppImage Katalog-${{ env.VERSION_TAG }}-x86_64.AppImage
        else
          echo "Warning: AppImage not found with expected pattern"
          ls -la *.AppImage || echo "No AppImage files found"
          exit 1
        fi

    - name: Test AppImage
      run: |
        cd build

        # Basic test - check if AppImage can show version
        chmod +x Katalog-${{ env.VERSION_TAG }}-x86_64.AppImage

        # Test extraction
        ./Katalog-${{ env.VERSION_TAG }}-x86_64.AppImage --appimage-extract-and-run --version || echo "Version check completed"

        # Get AppImage size and info
        ls -lh Katalog-${{ env.VERSION_TAG }}-x86_64.AppImage
        file Katalog-${{ env.VERSION_TAG }}-x86_64.AppImage

    - name: Upload AppImage to Release
      if: env.IS_RELEASE == 'true'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: build/Katalog-${{ env.VERSION_TAG }}-x86_64.AppImage
        asset_name: Katalog-${{ env.VERSION_TAG }}-x86_64.AppImage
        asset_content_type: application/octet-stream

    - name: Upload AppImage as Artifact
      if: env.IS_RELEASE != 'true'
      uses: actions/upload-artifact@v4
      with:
        name: Katalog-AppImage-${{ env.VERSION_TAG }}
        path: build/Katalog-${{ env.VERSION_TAG }}-x86_64.AppImage
        retention-days: 30

    - name: Summary
      run: |
        echo "## Build Complete! 🎉" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Version**: ${{ env.VERSION_TAG }}" >> $GITHUB_STEP_SUMMARY
        echo "- **File**: Katalog-${{ env.VERSION_TAG }}-x86_64.AppImage" >> $GITHUB_STEP_SUMMARY
        echo "- **Size**: $(ls -lh build/Katalog-${{ env.VERSION_TAG }}-x86_64.AppImage | awk '{print $5}')" >> $GITHUB_STEP_SUMMARY

        if [ "${{ env.IS_RELEASE }}" = "true" ]; then
          echo "- **Status**: ✅ Uploaded to GitHub Release" >> $GITHUB_STEP_SUMMARY
        else
          echo "- **Status**: 📦 Available as build artifact" >> $GITHUB_STEP_SUMMARY
        fi
