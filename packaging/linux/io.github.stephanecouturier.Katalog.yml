id: io.github.stephanecouturier.Katalog
runtime: org.kde.Platform
runtime-version: "6.11"
sdk: org.kde.Sdk
command: Katalog

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # File system: Katalog's core purpose is cataloging arbitrary storage locations
  # (external drives, NAS, removable media) so host access is required
  - --filesystem=host
  # DBus: needed for KDE integration (theming, file dialogs)
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=com.canonical.AppMenu.Registrar
  #- --env=QT_XCB_GL_INTEGRATION=none

modules:
  - name: Katalog
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_QT_QUICK=ON
      - -DBUILD_QT_WIDGETS=OFF
      - -DBUILD_TESTS=OFF
    sources:
      - type: git
        url: https://github.com/StephaneCouturier/Katalog.git
        tag: v3.0
        commit: 0ed8881f067649e2945d6d52cc74079fb92d0b8e
